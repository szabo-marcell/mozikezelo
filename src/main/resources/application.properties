spring.application.name=mozikezelo

server.port=9090

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop

# A DTO-k leképezése a service tranzakcióján belül történik.
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Ismeretlen (pl. jog, id) mező beküldése 400-as hibát ad.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Üres adatbázis feltöltése bemutató adatokkal. Kikapcsolás: APP_DEMO_DATA_ENABLED=false
app.demo-data.enabled=true

app.time-zone=Europe/Budapest

# JWT: Base64 kulcs (legalább 256 bit). Éles környezetben APP_JWT_SECRET környezeti változóból.
app.jwt.secret=${APP_JWT_SECRET:5jC+8QuVocq2R6y7OYrDwDlLdDRFoplhVXoc1TbENoB4h4C0DQXRb1DU0YTW86Z9}
app.jwt.lejarat-perc=60

# Jelszó-próbálgatás elleni védelem: ennyi sikertelen kísérlet az ablakon belül zárolja az e-mail címet / IP-címet.
app.bejelentkezes.max-hibas-email=5
app.bejelentkezes.max-hibas-ip=20
app.bejelentkezes.ablak-perc=15
app.bejelentkezes.zarolas-perc=15
