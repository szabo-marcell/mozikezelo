<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dynamic Cinema – Bejelentkezés</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <h1>Bejelentkezés</h1>
    <p class="alcim">Még nincs fiókod? <a href="regisztracio.html">Regisztrálj.</a></p>

    <p id="uzenet" class="uzenet"></p>

    <form id="bejelentkezes" class="urlap">
        <div class="mezo">
            <label for="email">E-mail cím</label>
            <input id="email" name="email" type="email" maxlength="254" required autocomplete="username">
        </div>
        <div class="mezo">
            <label for="jelszo">Jelszó</label>
            <input id="jelszo" name="jelszo" type="password" maxlength="100" required autocomplete="current-password">
        </div>
        <button class="gomb" type="submit">Bejelentkezés</button>
    </form>
</main>
<script src="js/app.js"></script>
<script src="js/bejelentkezes.js"></script>
</body>
</html>
